function StarRating({ rating, size = 14 }){
  const full = Math.floor(rating);
  const hasHalf = rating - full >= 0.4;
  const stars = [];
  for(let i=0;i<5;i++){
    if(i < full) stars.push(h(Icon,{key:i,name:'star',size,className:'text-amber-400'}));
    else stars.push(h(Icon,{key:i,name:'star-outline',size,className:'text-gray-300'}));
  }
  return h('div',{className:'flex items-center gap-0.5'}, stars);
}

// ==================== ROUTER ====================
function getHashPath(){
  const raw = window.location.hash.replace(/^#/, '');
  return raw === '' ? '/' : raw;
}
function matchRoute(pattern, path){
  const pParts = pattern.split('/').filter(Boolean);
  const uParts = path.split('/').filter(Boolean);
  if(pParts.length !== uParts.length) return null;
  const params = {};
  for(let i=0;i<pParts.length;i++){
    if(pParts[i].startsWith(':')) params[pParts[i].slice(1)] = decodeURIComponent(uParts[i]);
    else if(pParts[i] !== uParts[i]) return null;
  }
  return params;
}
const RouterContext = createContext(null);
function useRouter(){ return useContext(RouterContext); }
function Link({ to, className, children, onClick, ariaLabel }){
  const { navigate } = useRouter();
  return h('a', {
    href:'#'+to, className, 'aria-label': ariaLabel,
    onClick:(e)=>{ e.preventDefault(); if(onClick) onClick(); navigate(to); }
  }, children);
}

const AppStateContext = createContext(null);
function useAppState(){ return useContext(AppStateContext); }

// No legacy customer/checkout data stored in frontend. Rates come from signed API quotes.

function tierPrice(product,qty){
  return (product.priceTiers||[]).reduce((price,t)=>qty>=t.minQty?t.unitPriceIdr:price,product.salePrice);
}
function useCartLogic(){
  const [items,setItems]=useState(()=>{
    try {return JSON.parse(sessionStorage.getItem('trastar_qa_cart')||'[]')} catch{return []}
  });
  useEffect(()=>{sessionStorage.setItem('trastar_qa_cart',JSON.stringify(items))},[items]);
  function addToCart(product,variant,qty){
    if(!product||!product.variantId||!Number.isSafeInteger(qty)||qty<1)return;
    setItems(prev=>{
      const found=prev.find(i=>i.productId===product.id);
      const count=Math.min(product.stock,(found?.qty||0)+qty,999);
      if(count<1)return prev;
      return found?prev.map(i=>i.productId===product.id?{...i,qty:count}:i):[...prev,{productId:product.id,qty:count}];
    });
  }
  function updateQty(idx,qty){
    setItems(prev=>prev.map((it,i)=>{
      if(i!==idx)return it;
      const p=PRODUCTS.find(x=>x.id===it.productId);
      return {...it,qty:Math.max(1,Math.min(qty,999,p?.stock||1))};
    }));
  }
  function removeItem(idx){setItems(prev=>prev.filter((_,i)=>i!==idx))}
  function clearCart(){setItems([])}
  function applyCoupon(){return {ok:false,message:'Kupon belum aktif pada checkout development.'}}
  const enriched=items.map((it,index)=>({...it,index,variant:{},product:PRODUCTS.find(p=>p.id===it.productId)})).filter(it=>it.product&&it.product.stock>0);
  const subtotal=enriched.reduce((sum,it)=>sum+tierPrice(it.product,it.qty)*it.qty,0);
  const itemCount=enriched.reduce((sum,it)=>sum+it.qty,0);
  return {items:enriched,addToCart,updateQty,removeItem,clearCart,applyCoupon,coupon:null,subtotal,discount:0,itemCount};
}

function ShopPage(){
  const [category, setCategory] = useState('Semua');
  const [sort, setSort] = useState('popular');
  const [filterOpen, setFilterOpen] = useState(false);

  let list = [...PRODUCTS];
  if(category !== 'Semua') list = list.filter(p => p.category === category);
  if(sort === 'price-asc') list.sort((a,b)=> a.salePrice - b.salePrice);
  else if(sort === 'price-desc') list.sort((a,b)=> b.salePrice - a.salePrice);
  else if(sort === 'rating') list.sort((a,b)=> b.rating - a.rating);

  const FilterList = () => h('div',{ className:'space-y-1' },
    ['Semua', ...CATEGORIES.map(c=>c.name)].map(c => h('button',{ key:c, type:'button', onClick:()=>{ setCategory(c); setFilterOpen(false); },
      className: cx('w-full text-left px-3 py-2 rounded-lg text-sm font-medium transition-colors', category===c ? 'bg-[var(--trs-red)]/10 text-[var(--trs-red)]' : 'text-gray-600 hover:bg-gray-50') }, c))
  );

  return h('div',{ className:'max-w-7xl mx-auto px-4 py-8' },
    h(Breadcrumb,{ items:[{label:'Home', to:'/'},{label:'Shop'}] }),
    h('div',{ className:'flex items-center justify-between mb-6 gap-3' },
      h('h1',{ className:'font-display font-extrabold text-2xl text-[var(--trs-dark)]' }, 'Shop'),
      h('div',{ className:'flex items-center gap-2' },
        h('button',{ type:'button', onClick:()=>setFilterOpen(true), className:'lg:hidden flex items-center gap-1.5 border border-gray-200 rounded-lg px-3 py-2 text-sm font-medium text-gray-600' }, h(Icon,{name:'settings',size:14}), 'Filter'),
        h('select',{ value:sort, onChange:e=>setSort(e.target.value), className:'border border-gray-200 rounded-lg px-3 py-2 text-sm text-gray-600 bg-white' },
          h('option',{value:'popular'},'Paling Populer'), h('option',{value:'rating'},'Rating Tertinggi'),
          h('option',{value:'price-asc'},'Harga Terendah'), h('option',{value:'price-desc'},'Harga Tertinggi')

      )
    ),
    h('div',{ className:'grid lg:grid-cols-[220px_1fr] gap-8' },
      h('aside',{ className:'hidden lg:block' },
        h('h3',{ className:'font-semibold text-sm text-gray-800 mb-3' }, 'Kategori'),

function ProductDetailPage({ params }){
  const product = getProductBySlug(params.slug);
  const { navigate } = useRouter();
  const { addToCart } = useAppState();
  const [variant, setVariant] = useState(()=> product ? defaultVariant(product) : {});
  const [qty, setQty] = useState(1);
  const [tab, setTab] = useState('Description');
  const [added, setAdded] = useState(false);
  const [wish, setWish] = useState(false);
  const [galleryIdx, setGalleryIdx] = useState(0);

  useEffect(()=>{ if(product){ setVariant(defaultVariant(product)); setQty(1); setTab('Description'); setGalleryIdx(0); window.scrollTo(0,0); } }, [params.slug]);

  if(!product){
    return h('div',{ className:'max-w-7xl mx-auto px-4 py-24 text-center' },
      h('p',{ className:'text-gray-500 mb-4' }, 'Produk tidak ditemukan.'),
      h(Link,{ to:'/shop', className:'text-[var(--trs-red)] font-semibold' }, 'Kembali ke Shop')
    );
  }

  const pct = discountPct(product);
  const related = PRODUCTS.filter(p => p.category === product.category && p.id !== product.id).slice(0,4);
  const relatedFallback = related.length ? related : PRODUCTS.filter(p=>p.id!==product.id).slice(0,4);

  function handleAdd(){ addToCart(product, variant, qty); setAdded(true); setTimeout(()=>setAdded(false), 1800); }
  function handleBuyNow(){ addToCart(product, variant, qty); navigate('/checkout'); }

  return h('div',{ className:'max-w-7xl mx-auto px-4 py-8' },
    h(Breadcrumb,{ items:[{label:'Home', to:'/'},{label:product.category, to:'/shop'},{label:product.name}] }),
    h('div',{ className:'grid md:grid-cols-2 gap-8 lg:gap-12' },
      // GALLERY
      h('div',null,
        h('div',{ className:'aspect-square rounded-2xl overflow-hidden border border-gray-100' }, h(ProductThumb,{ product })),
        h('div',{ className:'grid grid-cols-4 gap-2.5 mt-3' },
          [0,1,2,3].map(i => h('button',{ key:i, type:'button', onClick:()=>setGalleryIdx(i),
            className: cx('aspect-square rounded-lg overflow-hidden border-2 transition-colors', galleryIdx===i ? 'border-[var(--trs-red)]' : 'border-transparent') },
            h(ProductThumb,{ product })))
        )
      ),
      // INFO
      h('div',null,
        h('span',{ className:'text-xs font-bold text-[var(--trs-red)] tracking-wide' }, product.brand),
        h('h1',{ className:'font-display font-extrabold text-2xl sm:text-3xl text-[var(--trs-dark)] mt-1 mb-2' }, product.name),
        h('div',{ className:'flex items-center gap-3 mb-4' },
          h(StarRating,{ rating:product.rating }), h('span',{ className:'text-sm font-semibold text-gray-700' }, product.rating), h('span',{ className:'text-sm text-gray-400' }, '('+product.reviewCount+' Reviews)')
        ),
        h('div',{ className:'flex items-baseline gap-3 mb-1' },
          h('span',{ className:'font-display font-extrabold text-3xl text-[var(--trs-dark)]' }, formatIDR(tierPrice(product,qty))),
          pct>0 && h('span',{ className:'text-lg text-gray-400 line-through' }, formatIDR(product.price)),
          pct>0 && h(Badge,null, pct+'% OFF')
        ),
        h('p',{ className:'text-sm mb-5' }, h('span',{className:'inline-flex items-center gap-1.5 text-emerald-600 font-semibold'}, h(Icon,{name:'check-circle',size:14}), 'In Stock'), h('span',{className:'text-gray-400'}, ' · '+product.stock+' tersedia')),
        h('p',{ className:'text-sm text-gray-600 leading-relaxed mb-6' }, product.description.split('\n\n')[0]),

        Object.keys(product.variants).map(key => (product.variants[key][0]==='-' ? null : h('div',{ key, className:'mb-4' },
          h('p',{ className:'text-sm font-semibold text-gray-700 mb-2' }, key+': ', h('span',{className:'font-normal text-gray-500'}, variant[key])),
          h('div',{ className:'flex flex-wrap gap-2' },
            product.variants[key].map(val => h('button',{ key:val, type:'button', onClick:()=>setVariant(v=>({...v,[key]:val})),
              className: cx('px-4 py-2 rounded-lg text-sm font-medium border transition-colors', variant[key]===val ? 'border-[var(--trs-red)] bg-[var(--trs-red)]/10 text-[var(--trs-red)]' : 'border-gray-200 text-gray-600 hover:border-gray-300') }, val))
          )
        ))),

        h('div',{ className:'flex items-center gap-4 mb-6' },
          h('span',{ className:'text-sm font-semibold text-gray-700' }, 'Jumlah:'),
          h(QuantitySelector,{ value:qty, onChange:q=>setQty(Math.min(q,Math.max(1,product.stock))) })
        ),

        product.priceTiers.length>0&&h('div',{className:'mb-5 text-xs rounded-lg bg-gray-50 border p-3'},
          h('strong',null,'Harga berdasarkan quantity'),

        ),
        h('div',{ className:'flex flex-col sm:flex-row gap-3 mb-4' },
          h('button',{ type:'button', disabled:product.stock<1, onClick:handleAdd, className:'trs-btn-primary flex-1 py-3.5 rounded-lg font-bold text-sm flex items-center justify-center gap-2' },
            h(Icon,{name:'cart',size:16}), added ? 'Ditambahkan ✓' : 'ADD TO CART'),
          h('button',{ type:'button', disabled:product.stock<1, onClick:handleBuyNow, className:'flex-1 py-3.5 rounded-lg font-bold text-sm border-2 border-[var(--trs-dark)] text-[var(--trs-dark)] hover:bg-[var(--trs-dark)] hover:text-white transition-colors' }, 'BUY NOW')
        ),

          h('span',{className:'text-gray-400'},'SKU'), h('span',{className:'text-gray-700 font-medium'}, product.sku),
          h('span',{className:'text-gray-400'},'Category'), h('span',{className:'text-gray-700 font-medium'}, product.category),
          h('span',{className:'text-gray-400'},'Brand'), h('span',{className:'text-gray-700 font-medium'}, product.brand),
          h('span',{className:'text-gray-400'},'Stock'), h('span',{className:'text-gray-700 font-medium'}, product.stock+' unit')
        )
      )
    ),

    // TABS
    h('div',{ className:'mt-14' },
      h('div',{ className:'flex gap-6 border-b border-gray-200 overflow-x-auto no-scrollbar' },
        TABS.map(t => h('button',{ key:t, type:'button', onClick:()=>setTab(t),
          className: cx('pb-3 text-sm font-semibold whitespace-nowrap border-b-2 transition-colors', tab===t ? 'border-[var(--trs-red)] text-[var(--trs-red)]' : 'border-transparent text-gray-400 hover:text-gray-600') }, t))
      ),
      h('div',{ className:'py-6 max-w-3xl' },
        tab==='Description' && h('div',{ className:'text-sm text-gray-600 leading-relaxed space-y-3' }, product.description.split('\n\n').map((p,i)=> h('p',{key:i}, p))),
        tab==='Specifications' && h('table',{ className:'w-full text-sm' }, h('tbody',null,
          Object.entries(product.specs).map(([k,v]) => h('tr',{ key:k, className:'border-b border-gray-100' },

        tab==='Compatibility' && h('ul',{ className:'grid sm:grid-cols-2 gap-2' }, product.compatibility.map((c,i) => h('li',{ key:i, className:'flex items-center gap-2 text-sm text-gray-600 bg-gray-50 rounded-lg px-3 py-2.5' }, h(Icon,{name:'check',size:14,className:'text-emerald-500'}), c))),

    h('h1',{ className:'font-display font-bold text-xl text-gray-800 mb-2' }, 'Halaman Tidak Ditemukan'),
    h(Link,{ to:'/', className:'text-[var(--trs-red)] font-semibold text-sm' }, 'Kembali ke Beranda')
  );
}

// ==================== ROUTES / APP ====================
const ROUTES = [
  { pattern:'/', component: HomePage },
  { pattern:'/shop', component: ShopPage },
  { pattern:'/product/:slug', component: ProductDetailPage },
  { pattern:'/cart', component: CartPage },
  { pattern:'/checkout', component: CheckoutPage },
  { pattern:'/payment', component: PaymentPage },
  { pattern:'/thank-you', component: ThankYouPage },
  { pattern:'/orders/:orderId', component: OrderDetailPage },
  { pattern:'/about', component: AboutPage },
  { pattern:'/contact', component: ContactPage },
];

function resolveRoute(path){
  for(const r of ROUTES){
    const params = matchRoute(r.pattern, path);
    if(params) return { component: r.component, params };
  }
  return { component: NotFoundPage, params:{} };
}

function App(){
  const [path, setPath] = useState(getHashPath());

  useEffect(()=>{
    function onHashChange(){ setPath(getHashPath()); window.scrollTo(0,0); }
    window.addEventListener('hashchange', onHashChange);
    return ()=> window.removeEventListener('hashchange', onHashChange);
  },[]);

  const navigate = useCallback((to)=>{
    if(('#'+to) === window.location.hash || (to==='/' && window.location.hash==='')){
      setPath(to); window.scrollTo(0,0);
    } else {
      window.location.hash = to;
    }
  },[]);

  const router = useMemo(()=>({ path, navigate }), [path, navigate]);
  const cart = useCartLogic();
  const appState = useMemo(()=> ({ ...cart }), [cart.items, cart.coupon, cart.subtotal, cart.discount, cart.itemCount]);

  const { component: PageComponent, params } = resolveRoute(path);

  return h(RouterContext.Provider, { value: router },
    h(AppStateContext.Provider, { value: appState },
      h('div',{ className:'min-h-screen flex flex-col bg-[var(--trs-bg)]' },
        h(Header),
        h('main',{ className:'flex-1' }, h(PageComponent, { params, key: path })),
        h(Footer)
      )
    )
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
window.startTrastarStorefront = ()=>root.render(h(App));
</script>
<script defer src="/storefront-connected.js"></script></body></html>
