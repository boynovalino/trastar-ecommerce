function StarRating({ rating, size = 14 }){
  const full = Math.floor(rating);
  const hasHalf = rating - full >= 0.4;
  const stars = [];
  for(let i=0;i<5;i++){
    if(i < full) stars.push(h(Icon,{key:i,name:'star',size,className:'text-amber-400'}));
    else stars.push(h(Icon,{key:i,name:'star-outline',size,className:'text-gray-300'}));
  }
  return h('div',{className:'flex items-center gap-0.5'}, stars);
}

function getHashPath(){
  const raw = window.location.hash.replace(/^#/, '');
  return raw === '' ? '/' : raw;
}
function matchRoute(pattern, path){
  const pParts = pattern.split('/').filter(Boolean);
  const uParts = path.split('/').filter(Boolean);
  if(pParts.length !== uParts.length) return null;
  const params = {};
  for(let i=0;i<pParts.length;i++){
    if(pParts[i].startsWith(':')) params[pParts[i].slice(1)] = decodeURIComponent(uParts[i]);
    else if(pParts[i] !== uParts[i]) return null;
  }
  return params;
}

function useRouter(){ return useContext(RouterContext); }
function Link({ to, className, children, onClick, ariaLabel }){
  const { navigate } = useRouter();
  return h('a', {
    href:'#'+to, className, 'aria-label': ariaLabel,
    onClick:(e)=>{ e.preventDefault(); if(onClick) onClick(); navigate(to); }
  }, children);
}

function useCartLogic(){
  const [items, setItems] = useState(()=> loadLS('trastar_cart', []));
  useEffect(()=>{ saveLS('trastar_cart', items); }, [items]);

  const [coupon, setCoupon] = useState(()=> loadLS('trastar_coupon', null));
  useEffect(()=>{ saveLS('trastar_coupon', coupon); }, [coupon]);

  function variantKey(variant){ return Object.values(variant||{}).join('|'); }

  function addToCart(product, variant, qty){
    setItems(prev=>{
      const key = variantKey(variant);
      const idx = prev.findIndex(it => it.productId === product.id && it.variantKey === key);
      if(idx > -1){
        const next = [...prev];
        next[idx] = { ...next[idx], qty: next[idx].qty + qty };
        return next;
      }
      return [...prev, { productId: product.id, variant, variantKey: key, qty }];
    });
  }
  function updateQty(idx, qty){
    setItems(prev => prev.map((it,i)=> i===idx ? { ...it, qty: Math.max(1, qty) } : it));
  }
  function removeItem(idx){
    setItems(prev => prev.filter((_,i)=> i!==idx));
  }
  function clearCart(){ setItems([]); setCoupon(null); }

  function applyCoupon(code){
    const norm = (code||'').trim().toUpperCase();
    if(norm === 'TRASTAR10'){ setCoupon({ code:norm, percent:10 }); return { ok:true, message:'Kupon berhasil diterapkan! Diskon 10%.' }; }
    setCoupon(null);
    return { ok:false, message:'Kode kupon tidak valid.' };
  }

  const enrichedItems = items.map((it,idx)=>({ ...it, index: idx, product: PRODUCTS.find(p=>p.id===it.productId) })).filter(it=>it.product);
  const subtotal = enrichedItems.reduce((sum,it)=> sum + it.product.salePrice * it.qty, 0);
  const discount = coupon ? Math.round(subtotal * coupon.percent/100) : 0;
  const itemCount = enrichedItems.reduce((sum,it)=> sum + it.qty, 0);

  return { items: enrichedItems, addToCart, updateQty, removeItem, clearCart, coupon, applyCoupon, subtotal, discount, itemCount };
}

function useOrdersLogic(){
  function generateOrderNumber(){
    const d = new Date();
    const dateStr = d.getFullYear().toString() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
    let seq = loadLS('trastar_order_seq', 0) + 1;
    saveLS('trastar_order_seq', seq);
    return 'TRS' + dateStr + String(seq).padStart(3,'0');
  }
  function saveOrder(order){
    const all = loadLS('trastar_orders', {});
    all[order.orderNumber] = order;
    saveLS('trastar_orders', all);
    saveLS('trastar_last_order', order.orderNumber);
  }
  function getOrder(orderNumber){
    const all = loadLS('trastar_orders', {});
    return all[orderNumber] || null;
  }
  function getLastOrderNumber(){ return loadLS('trastar_last_order', null); }
  return { generateOrderNumber, saveOrder, getOrder, getLastOrderNumber };
}

function ShopPage(){

function QRPlaceholder(){
  const cells = useMemo(()=>{
    const seed = 42; let s = seed; const arr = [];
    for(let i=0;i<21*21;i++){ s = (s*9301+49297)%233280; arr.push(s/233280 > 0.52); }
    return arr;
  },[]);
  const size = 21, cell = 8;
  const finder = (x,y) => h('g',{ key:x+'-'+y },
    h('rect',{x,y,width:cell*7,height:cell*7,fill:'#111'}), h('rect',{x:x+cell,y:y+cell,width:cell*5,height:cell*5,fill:'#fff'}), h('rect',{x:x+cell*2,y:y+cell*2,width:cell*3,height:cell*3,fill:'#111'})
  );
  return h('svg',{ viewBox:`0 0 ${size*cell} ${size*cell}`, className:'w-44 h-44 sm:w-52 sm:h-52' },
    h('rect',{x:0,y:0,width:size*cell,height:size*cell,fill:'#fff'}),
    cells.map((on,i)=>{
      const x = i % size, y = Math.floor(i/size);
      if((x<7&&y<7)||(x>=size-7&&y<7)||(x<7&&y>=size-7)) return null;
      return on ? h('rect',{ key:i, x:x*cell, y:y*cell, width:cell, height:cell, fill:'#111' }) : null;
    }),
    finder(0,0), finder((size-7)*cell,0), finder(0,(size-7)*cell)
  );
}

function CopyButton({ text }){

      if(navigator.clipboard){ navigator.clipboard.writeText(text).catch(()=>{}); }
      setCopied(true); setTimeout(()=>setCopied(false), 1500);
    }, className:'flex items-center gap-1.5 text-xs font-bold text-[var(--trs-red)] border border-[var(--trs-red)]/30 rounded-lg px-3 py-1.5 hover:bg-[var(--trs-red)]/5 flex-shrink-0' },
    h(Icon,{ name: copied?'check':'copy', size:13 }), copied ? 'Copied' : 'COPY'
  );
}

function useOrdersOnce(){
  const ref = useRef(null);
  if(!ref.current) ref.current = useOrdersLogic();
  return ref.current;
}

// ==================== ROUTES / APP ====================
const ROUTES = [
  { pattern:'/', component: HomePage },
  { pattern:'/shop', component: ShopPage },
  { pattern:'/product/:slug', component: ProductDetailPage },
  { pattern:'/cart', component: CartPage },
  { pattern:'/checkout', component: CheckoutPage },
  { pattern:'/payment', component: PaymentPage },
  { pattern:'/thank-you', component: ThankYouPage },
  { pattern:'/orders/:orderId', component: OrderDetailPage },
  { pattern:'/about', component: AboutPage },
  { pattern:'/contact', component: ContactPage },
];

function resolveRoute(path){
  for(const r of ROUTES){
    const params = matchRoute(r.pattern, path);
    if(params) return { component: r.component, params };
  }
  return { component: NotFoundPage, params:{} };
}

function App(){
  const [path, setPath] = useState(getHashPath());

  useEffect(()=>{
    function onHashChange(){ setPath(getHashPath()); window.scrollTo(0,0); }
    window.addEventListener('hashchange', onHashChange);
    return ()=> window.removeEventListener('hashchange', onHashChange);
  },[]);

  const navigate = useCallback((to)=>{
    if(('#'+to) === window.location.hash || (to==='/' && window.location.hash==='')){
      setPath(to); window.scrollTo(0,0);
    } else {
      window.location.hash = to;
    }
  },[]);

  const router = useMemo(()=>({ path, navigate }), [path, navigate]);
  const cart = useCartLogic();
  const appState = useMemo(()=> ({ ...cart }), [cart.items, cart.coupon, cart.subtotal, cart.discount, cart.itemCount]);

  const { component: PageComponent, params } = resolveRoute(path);

  return h(RouterContext.Provider, { value: router },
    h(AppStateContext.Provider, { value: appState },
      h('div',{ className:'min-h-screen flex flex-col bg-[var(--trs-bg)]' },
        h(Header),
        h('main',{ className:'flex-1' }, h(PageComponent, { params, key: path })),
        h(Footer)
      )
    )
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(h(App));
