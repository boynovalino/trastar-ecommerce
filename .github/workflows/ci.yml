name: TRASTAR source verification
on:
  pull_request:
    branches: [main]
  push:
    branches: ["feat/**"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies from lockfile
        run: npm ci --no-audit --no-fund
      - name: Static JavaScript verification
        run: npm run check
      - name: Unit and static source tests
        run: npm test
