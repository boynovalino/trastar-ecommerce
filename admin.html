<style>

  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0; font-family:'Inter',system-ui,sans-serif; background:var(--trs-bg); color:var(--trs-dark);
    padding-top:var(--safe-t); padding-bottom:var(--safe-b); -webkit-font-smoothing:antialiased; overflow-x:hidden;}
  h1,h2,h3,h4,.font-display{font-family:'Manrope',system-ui,sans-serif;}

  .no-scrollbar::-webkit-scrollbar{display:none;} .no-scrollbar{-ms-overflow-style:none;scrollbar-width:none;}
  .trs-btn-primary{background:var(--trs-red);color:#fff;transition:background .15s ease, transform .1s ease;}
  .trs-btn-primary:hover{background:var(--trs-red-dark);} .trs-btn-primary:active{transform:scale(0.98);}
  input:focus, select:focus, textarea:focus, button:focus-visible, a:focus-visible{outline:2px solid var(--trs-red); outline-offset:1px;}
  @keyframes trs-fade-up{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
  .trs-animate-in{animation:trs-fade-up .25s ease both;}
  @keyframes trs-spin{to{transform:rotate(360deg);}} .trs-spin{animation:trs-spin 1s linear infinite;}
  @keyframes trs-toast-in{from{opacity:0; transform:translateY(8px) scale(.98);} to{opacity:1; transform:translateY(0) scale(1);}}

  table{border-collapse:collapse;}
  .trs-scrollbox::-webkit-scrollbar{height:6px;width:6px;}

function formatIDR(n){ return 'Rp' + Math.round(n).toLocaleString('id-ID'); }
function formatDate(d){ const dt = typeof d==='string' ? new Date(d) : d; return dt.toLocaleDateString('id-ID',{ day:'numeric', month:'short', year:'numeric' }); }
function formatDateTime(d){ const dt = typeof d==='string' ? new Date(d) : d; return dt.toLocaleDateString('id-ID',{ day:'numeric', month:'short', year:'numeric' }) + ' ' + dt.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}); }
function loadLS(key, fallback){ try{ const raw = window.localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }catch(e){ return fallback; } }
function saveLS(key, value){ try{ window.localStorage.setItem(key, JSON.stringify(value)); }catch(e){} }
function daysAgoISO(n){ const d = new Date(); d.setDate(d.getDate()-n); return d.toISOString(); }
function seededRand(seed){ let s = seed; return function(){ s = (s*9301+49297)%233280; return s/233280; }; }
function downloadCSV(filename, rows){
  const csv = rows.map(r => r.map(cell => {
    const s = String(cell==null?'':cell);
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(',')).join('\n');
  const blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  document.body.removeChild(a); setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

    const city = CITIES[Math.floor(rnd()*CITIES.length)];

function getHashPath(){ const raw = window.location.hash.replace(/^#/, ''); return raw === '' ? '/admin' : raw; }
function matchRoute(pattern, path){
  const pParts = pattern.split('/').filter(Boolean); const uParts = path.split('/').filter(Boolean);
  if(pParts.length !== uParts.length) return null;
  const params = {};
  for(let i=0;i<pParts.length;i++){
    if(pParts[i].startsWith(':')) params[pParts[i].slice(1)] = decodeURIComponent(uParts[i]);
    else if(pParts[i] !== uParts[i]) return null;
  }
  return params;
}

}

const ORDER_STATUS_FLOW = ['New Order','Awaiting Payment','Paid','Processing','Ready to Ship','Shipped','Delivered','Completed'];
const CURRENT_STAFF = 'Sari Kusuma';

function useAdminLogic(showToast){
  const [data, setData] = useState(loadAdminState);
  useEffect(()=>{ saveLS('trastar_admin_state', data); }, [data]);

  function pushAudit(action){
    setData(d => ({ ...d, auditLog: [{ id: Date.now(), staff: CURRENT_STAFF, action, time: new Date().toISOString() }, ...d.auditLog] }));
  }

  function updateOrderStatus(orderNumber, newStatus, extra){
    setData(d => ({ ...d, orders: d.orders.map(o => o.orderNumber===orderNumber ? {
      ...o, orderStatus: newStatus,
      paymentStatus: newStatus==='Paid' || ORDER_STATUS_FLOW.indexOf(newStatus) > ORDER_STATUS_FLOW.indexOf('Paid') ? 'Paid' : o.paymentStatus,
      shippingStatus: newStatus==='Shipped' ? 'In Transit' : newStatus==='Delivered'||newStatus==='Completed' ? 'Delivered' : newStatus==='Ready to Ship' ? 'Waiting Pickup' : o.shippingStatus,
      timeline: [...o.timeline, { label: newStatus, date: new Date().toISOString() }],
      ...(extra||{}),
    } : o) }));
    pushAudit(`mengubah status Order ${orderNumber} menjadi ${newStatus}`);
    showToast(`Order ${orderNumber} diubah ke "${newStatus}"`);
  }
  function addTracking(orderNumber, courier, trackingNumber){
    setData(d => ({ ...d, orders: d.orders.map(o => o.orderNumber===orderNumber ? { ...o, courier, trackingNumber, shippingStatus: o.shippingStatus==='Not Shipped' ? 'Waiting Pickup' : o.shippingStatus, timeline:[...o.timeline, { label:'Tracking Number Added: '+trackingNumber, date:new Date().toISOString() }] } : o) }));
    pushAudit(`menambahkan nomor resi ${trackingNumber} pada Order ${orderNumber}`);
    showToast('Nomor resi berhasil ditambahkan');
  }
  function markShipped(orderNumber){
    updateOrderStatus(orderNumber, 'Shipped');
  }
  function addOrderNote(orderNumber, note){
    setData(d => ({ ...d, orders: d.orders.map(o => o.orderNumber===orderNumber ? { ...o, internalNotes:[...o.internalNotes, { text:note, staff:CURRENT_STAFF, date:new Date().toISOString() }] } : o) }));
    showToast('Catatan internal disimpan');
  }
  function cancelOrder(orderNumber){ updateOrderStatus(orderNumber, 'Cancelled'); }
  function refundOrder(orderNumber){ updateOrderStatus(orderNumber, 'Refunded'); }

  function adjustStock(productId, type, qty, reason, notes){
    setData(d => {
      const p = d.products.find(pp=>pp.id===productId);
      if(!p) return d;
      const before = p.stock;
      let after = before;
      if(type==='Add') after = before + qty;
      else if(type==='Reduce') after = Math.max(0, before - qty);
      else if(type==='Set') after = qty;
      const change = after - before;
      const newStatus = after===0 ? 'Out of Stock' : after<=p.minStock ? 'Low Stock' : (p.status==='Draft' ? 'Draft' : 'Active');
      const products = d.products.map(pp => pp.id===productId ? { ...pp, stock:after, status:newStatus, updated:new Date().toISOString() } : pp);
      const historyRow = { id: Date.now(), date:new Date().toISOString(), product:p.name, sku:p.sku, type: change>=0?'Add':'Reduce', qtyBefore:before, change, qtyAfter:after, reason, notes, staff:CURRENT_STAFF };
      return { ...d, products, stockHistory:[historyRow, ...d.stockHistory] };
    });
    pushAudit(`menyesuaikan stok produk (${reason})`);
    showToast('Stok berhasil diperbarui');
  }

  function addProduct(product){
    setData(d => ({ ...d, products:[{ ...product, id: Math.max(0,...d.products.map(p=>p.id))+1, updated:new Date().toISOString() }, ...d.products] }));
    pushAudit(`menambahkan produk baru "${product.name}"`);
  }
  function updateProductStatus(productId, status){
    setData(d => ({ ...d, products: d.products.map(p => p.id===productId ? { ...p, status, updated:new Date().toISOString() } : p) }));
    showToast('Status produk diperbarui');
  }
  function duplicateProduct(productId){
    setData(d => {
      const p = d.products.find(pp=>pp.id===productId); if(!p) return d;
      const copy = { ...p, id: Math.max(0,...d.products.map(x=>x.id))+1, name: p.name+' (Copy)', sku: p.sku+'-CP', status:'Draft', updated:new Date().toISOString() };
      return { ...d, products:[copy, ...d.products] };
    });
    showToast('Produk berhasil diduplikasi sebagai draft');
  }
  function deleteProduct(productId){
    setData(d => ({ ...d, products: d.products.filter(p=>p.id!==productId) }));
    showToast('Produk dihapus');
  }

  function approveReturn(id, action){
    const statusMap = { approve:'Approved', reject:'Rejected', refund:'Refunded', replace:'Replaced' };
    setData(d => ({ ...d, returns: d.returns.map(r => r.id===id ? { ...r, status: statusMap[action], timeline:[...r.timeline, { label: statusMap[action], date:new Date().toISOString() }] } : r) }));
    pushAudit(`memproses permintaan retur ${id} (${statusMap[action]})`);
    showToast(`Retur ${id} ditandai "${statusMap[action]}"`);
  }
  function addReturnNote(id, note){
    setData(d => ({ ...d, returns: d.returns.map(r => r.id===id ? { ...r, adminNotes: note } : r) }));
    showToast('Catatan admin disimpan');
  }

  function togglePromotion(id){
    setData(d => ({ ...d, promotions: d.promotions.map(p => p.id===id ? { ...p, status: p.status==='Active' ? 'Paused' : 'Active' } : p) }));
    pushAudit(`mengubah status promosi #${id}`);
    showToast('Status promosi diperbarui');
  }
  function addPromotion(promo){
    setData(d => ({ ...d, promotions:[{ ...promo, id: Math.max(0,...d.promotions.map(p=>p.id))+1, usage:0, revenue:0, status:'Active' }, ...d.promotions] }));
    pushAudit(`membuat promosi baru "${promo.name}"`);
    showToast('Promosi baru berhasil dibuat');
  }

  function addCustomerNote(id, note){
    setData(d => ({ ...d, customers: d.customers.map(c => c.id===id ? { ...c, notes: note } : c) }));
    showToast('Catatan pelanggan disimpan');
  }
  function toggleCustomerTag(id, tag){
    setData(d => ({ ...d, customers: d.customers.map(c => {
      if(c.id!==id) return c;
      const has = (c.tags||[]).includes(tag);
      return { ...c, tags: has ? c.tags.filter(t=>t!==tag) : [...(c.tags||[]), tag] };
    }) }));
  }

  function receivePO(id){
    setData(d => ({ ...d, purchaseOrders: d.purchaseOrders.map(po => po.id===id ? { ...po, status:'Received', payment: po.payment==='Unpaid' ? 'Partial' : po.payment } : po) }));
    pushAudit(`menerima barang untuk PO ${id}`);
    showToast('Barang PO ditandai diterima');
  }
  function cancelPO(id){
    setData(d => ({ ...d, purchaseOrders: d.purchaseOrders.map(po => po.id===id ? { ...po, status:'Cancelled' } : po) }));
    showToast('PO dibatalkan');
  }

  function updateStaffRole(id, role){
    setData(d => ({ ...d, staff: d.staff.map(s => s.id===id ? { ...s, role } : s) }));
    pushAudit(`mengubah role staff menjadi ${role}`);
    showToast('Role staff diperbarui');
  }

  return { data, updateOrderStatus, addTracking, markShipped, addOrderNote, cancelOrder, refundOrder,
    adjustStock, addProduct, updateProductStatus, duplicateProduct, deleteProduct,
    approveReturn, addReturnNote, togglePromotion, addPromotion, addCustomerNote, toggleCustomerTag,
    receivePO, cancelPO, updateStaffRole, pushAudit };
}

// ---- simple SVG charts (no external deps) ----
function LineChartSVG({ data, width=600, height=200, color='#E11D2E', valueKey='sales' }){
  const w = width, hgt = height, pad = 28;
  const values = data.map(d=>d[valueKey]);
  const max = Math.max(...values, 1), min = Math.min(...values, 0);
  const range = (max-min) || 1;
  const stepX = (w - pad*2) / (data.length-1);
  const pts = data.map((d,i)=> [ pad + i*stepX, hgt - pad - ((d[valueKey]-min)/range)*(hgt-pad*2) ]);
  const pathD = pts.map((p,i)=> (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const areaD = pathD + ` L${pts[pts.length-1][0].toFixed(1)},${hgt-pad} L${pts[0][0].toFixed(1)},${hgt-pad} Z`;
  const gid = 'lg'+valueKey;
  return h('svg',{ viewBox:`0 0 ${w} ${hgt}`, className:'w-full h-auto', preserveAspectRatio:'none' },
    h('defs',null, h('linearGradient',{ id:gid, x1:'0',y1:'0',x2:'0',y2:'1' }, h('stop',{ offset:'0%', stopColor:color, stopOpacity:0.25 }), h('stop',{ offset:'100%', stopColor:color, stopOpacity:0 }))),
    [0.25,0.5,0.75].map(f => h('line',{ key:f, x1:pad, x2:w-pad, y1: pad+(hgt-pad*2)*f, y2: pad+(hgt-pad*2)*f, stroke:'#F1F1F1', strokeWidth:1 })),
    h('path',{ d:areaD, fill:`url(#${gid})`, stroke:'none' }),
    h('path',{ d:pathD, fill:'none', stroke:color, strokeWidth:2.2, strokeLinecap:'round', strokeLinejoin:'round' }),
    pts.length<=31 && pts.filter((_,i)=> i===pts.length-1).map((p,i)=> h('circle',{ key:i, cx:p[0], cy:p[1], r:3.5, fill:color }))
  );
}
function BarChartSVG({ data, width=600, height=220, color='#E11D2E', labelKey='label', valueKey='value' }){
  const w=width, hgt=height, pad=30, gap=10;
  const max = Math.max(...data.map(d=>d[valueKey]), 1);
  const barW = (w - pad*2 - gap*(data.length-1)) / data.length;
  return h('svg',{ viewBox:`0 0 ${w} ${hgt}`, className:'w-full h-auto', preserveAspectRatio:'none' },
    data.map((d,i)=>{
      const bh = (d[valueKey]/max) * (hgt-pad*2);
      const x = pad + i*(barW+gap), y = hgt-pad-bh;
      return h('g',{ key:i },
        h('rect',{ x, y, width:barW, height:bh, rx:4, fill:color, opacity: 0.55 + 0.45*(d[valueKey]/max) }),
        h('text',{ x:x+barW/2, y:hgt-pad+14, textAnchor:'middle', fontSize:10, fill:'#6B7280' }, d[labelKey])
      );
    })
  );
}
function DonutChartSVG({ data, size=160, colors }){
  const total = data.reduce((s,d)=>s+d.value,0) || 1;
  const palette = colors || ['#E11D2E','#111111','#6B7280','#F59E0B','#3B82F6'];
  let angle = -90;
  const r = size/2 - 10, cx0 = size/2, cy0 = size/2;
  const arcs = data.map((d,i)=>{
    const frac = d.value/total, sweep = frac*360;
    const x1 = cx0 + r*Math.cos(angle*Math.PI/180), y1 = cy0 + r*Math.sin(angle*Math.PI/180);
    const endAngle = angle+sweep;
    const x2 = cx0 + r*Math.cos(endAngle*Math.PI/180), y2 = cy0 + r*Math.sin(endAngle*Math.PI/180);
    const large = sweep>180?1:0;
    const path = `M${cx0},${cy0} L${x1.toFixed(2)},${y1.toFixed(2)} A${r},${r} 0 ${large} 1 ${x2.toFixed(2)},${y2.toFixed(2)} Z`;
    angle = endAngle;
    return h('path',{ key:i, d:path, fill:palette[i%palette.length] });
  });
  return h('svg',{ viewBox:`0 0 ${size} ${size}`, className:'w-full h-auto' }, arcs, h('circle',{ cx:cx0, cy:cy0, r:r*0.55, fill:'#fff' }));
}

function GlobalSearch(){
  const { data } = useAdmin();
  const { navigate } = useRouter();
  const [q, setQ] = useState('');
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  useEffect(()=>{ function onDoc(e){ if(ref.current && !ref.current.contains(e.target)) setOpen(false); } document.addEventListener('mousedown', onDoc); return ()=>document.removeEventListener('mousedown', onDoc); },[]);

  const results = useMemo(()=>{
    if(q.trim().length<2) return [];
    const query = q.toLowerCase();
    const out = [];
    data.orders.filter(o=>o.orderNumber.toLowerCase().includes(query)).slice(0,3).forEach(o=> out.push({ type:'Order', label:o.orderNumber, sub:o.customer, to:'/admin/orders/'+o.orderNumber, icon:'bag' }));
    data.customers.filter(c=>c.name.toLowerCase().includes(query)).slice(0,3).forEach(c=> out.push({ type:'Customer', label:c.name, sub:c.phone, to:'/admin/customers/'+c.id, icon:'users' }));
    data.products.filter(p=>p.name.toLowerCase().includes(query) || p.sku.toLowerCase().includes(query)).slice(0,4).forEach(p=> out.push({ type:'Product', label:p.name, sub:p.sku, to:'/admin/products/'+p.id, icon:'box' }));
    return out.slice(0,8);
  },[q, data]);

  return h('div',{ ref, className:'relative flex-1 max-w-md' },
    h('div',{ className:'relative' },
      h(Icon,{ name:'search', size:15, className:'absolute left-3 top-1/2 -translate-y-1/2 text-gray-400' }),
      h('input',{ type:'text', value:q, onFocus:()=>setOpen(true), onChange:e=>{ setQ(e.target.value); setOpen(true); },
        placeholder:'Search order, customer, SKU, product...', className:'w-full pl-9 pr-3 py-2 rounded-lg bg-gray-100 text-sm focus:bg-white focus:ring-2 focus:ring-[var(--trs-red)]/20 border border-transparent' })
    ),
    open && results.length>0 && h('div',{ className:'absolute z-40 mt-2 w-full bg-white rounded-xl shadow-xl border border-[var(--trs-border)] overflow-hidden' },
      results.map((r,i) => h('button',{ key:i, type:'button', onClick:()=>{ setOpen(false); setQ(''); navigate(r.to); },
          className:'w-full flex items-center gap-3 px-3 py-2.5 hover:bg-gray-50 text-left' },
        h('div',{ className:'w-8 h-8 rounded-lg bg-[var(--trs-bg)] flex items-center justify-center flex-shrink-0' }, h(Icon,{ name:r.icon, size:14 })),
        h('div',{ className:'flex-1 min-w-0' }, h('p',{ className:'text-sm font-medium text-gray-800 truncate' }, r.label), h('p',{ className:'text-xs text-gray-400' }, r.type+' · '+r.sub))

  );
}

  const { data, updateProductStatus, duplicateProduct, deleteProduct } = useAdmin();

  const showToast = useToast();
  const [search, setSearch] = useState('');
  const [category, setCategory] = useState('Semua');
  const [status, setStatus] = useState('Semua');
  const [stockFilter, setStockFilter] = useState('Semua');

  const [confirmDelete, setConfirmDelete] = useState(null);
  const [openActionId, setOpenActionId] = useState(null);

  let list = data.products.filter(p => p.name.toLowerCase().includes(search.toLowerCase()) || p.sku.toLowerCase().includes(search.toLowerCase()));
  if(category!=='Semua') list = list.filter(p=>p.category===category);

  function toggleSelect(id){ setSelected(s => s.includes(id) ? s.filter(x=>x!==id) : [...s, id]); }

      h('button',{ type:'button', onClick:()=>setSelected([]), className:'font-semibold hover:underline' }, 'Batal')

      h('div',{ className:'overflow-x-auto trs-scrollbox' },

            h(Td,null, h(Checkbox,{ checked:selected.includes(p.id), onChange:()=>toggleSelect(p.id) })),

                [ ['View', ()=>navigate('/admin/products/'+p.id)], ['Edit', ()=>{ navigate('/admin/products/'+p.id); }],
                  ['Duplicate', ()=>duplicateProduct(p.id)], ['Archive', ()=>updateProductStatus(p.id,'Archived')],

function ProductWizardPage(){
  const [step, setStep] = useState(0);
  const [form, setForm] = useWizardState();
  const { addProduct } = useAdmin();
  const { navigate } = useRouter();
  const showToast = useToast();

  useEffect(()=>{ saveLS('trastar_wizard_draft', form); }, [form]);
  function set(field){ return (val)=> setForm(f=>({ ...f, [field]: val })); }
  function setEv(field){ return (e)=> set(field)(e.target.value); }

  function saveDraft(){ showToast('Draft produk disimpan'); }
  function generateVariants(){
    const axes = Object.entries(form.variantAxes).filter(([k,v])=>v.length>0);
    if(axes.length===0){ setForm(f=>({...f, variantRows:[]})); return; }
    let combos = [{}];
    axes.forEach(([key, values]) => {
      const next = [];
      combos.forEach(c => values.forEach(v => next.push({ ...c, [key]: v })));
      combos = next;
    });
    const rows = combos.map((c,i) => ({ id:i+1, combo:c, sku: form.sku+'-'+Object.values(c).map(v=>v.slice(0,3).toUpperCase()).join(''), price: form.salePrice||form.regularPrice, stock: form.stockQty||0, status:'Active' }));
    setForm(f=>({ ...f, variantRows: rows }));
    showToast(rows.length+' kombinasi varian dibuat');
  }
  function toggleCompat(brand, model){
    const key = brand+' '+model;
    setForm(f => ({ ...f, compatibility: f.compatibility.includes(key) ? f.compatibility.filter(x=>x!==key) : [...f.compatibility, key] }));
  }

    if(!form.name || !form.sku){ showToast('Nama produk dan SKU wajib diisi', 'error'); setStep(0); return; }

      name: form.name, sku: form.sku, brand:'TRASTAR', category: form.category, icon: CATEGORY_ICON[form.category]||'box',
      price: Number(form.regularPrice)||0, salePrice: Number(form.salePrice)||Number(form.regularPrice)||0, hpp:Number(form.costPrice)||0,
      stock: Number(form.stockQty)||0, reserved:0, incoming:0, minStock:Number(form.minStock)||5,
      variants: form.variantRows.length||1, status:'Active', rating:'5.0', reviewCount:0,

          h(WField,{ label:'Subcategory' }, h('input',{ className:wInputCls, value:form.subcategory, onChange:setEv('subcategory'), placeholder:'opsional' })),
          h(WField,{ label:'Product Type' }, h('div',{ className:'flex gap-2' },
            ['Simple','Variable'].map(t => h('button',{ key:t, type:'button', onClick:()=>set('productType')(t), className: cx('flex-1 py-2.5 rounded-lg text-sm font-semibold border', form.productType===t ? 'border-[var(--trs-red)] bg-red-50 text-[var(--trs-red)]' : 'border-[var(--trs-border)] text-gray-500') }, t+' Product')))

function StockAdjustDrawer({ open, onClose, product, onDone }){
  const { adjustStock, data } = useAdmin();
  const [type, setType] = useState('Add');
  const [qty, setQty] = useState(10);
  const [reason, setReason] = useState('Purchase');
  const [notes, setNotes] = useState('');
  const [productId, setProductId] = useState(product ? product.id : (data.products[0] && data.products[0].id));
  useEffect(()=>{ if(product) setProductId(product.id); }, [product, open]);
  const p = data.products.find(x=>x.id===productId) || product;
  if(!p) return null;
  function submit(){
    adjustStock(p.id, type, Number(qty), reason, notes);
    if(onDone) onDone();
    onClose();
  }
  return h(Drawer,{ open, onClose, title:'Stock Adjustment' },
    h('div',{ className:'space-y-4' },
      !product && h(WField,{ label:'Product' }, h(Select,{ value:productId, onChange:v=>setProductId(Number(v)), options: data.products.map(pp=>({ value:pp.id, label:pp.name })), className:'w-full' })),
      h('div',{ className:'bg-[var(--trs-bg)] rounded-lg p-3 text-sm flex justify-between' }, h('span',{className:'text-gray-500'},'Current Stock'), h('span',{className:'font-bold'}, p.stock)),
      h(WField,{ label:'Adjustment Type' }, h('div',{ className:'flex gap-2' },
        ['Add','Reduce','Set'].map(t => h('button',{ key:t, type:'button', onClick:()=>setType(t), className: cx('flex-1 py-2 rounded-lg text-xs font-semibold border', type===t?'border-[var(--trs-red)] bg-red-50 text-[var(--trs-red)]':'border-[var(--trs-border)] text-gray-500') }, t)))),
      h(WField,{ label: type==='Set' ? 'New Stock Quantity' : 'Quantity' }, h('input',{ type:'number', className:wInputCls, value:qty, onChange:e=>setQty(e.target.value) })),
      h(WField,{ label:'Reason' }, h(Select,{ value:reason, onChange:setReason, options:['Purchase','Sales Correction','Damaged','Return','Stock Opname'], className:'w-full' })),
      h(WField,{ label:'Notes' }, h('textarea',{ className:wInputCls, rows:2, value:notes, onChange:e=>setNotes(e.target.value) })),
      h('button',{ type:'button', onClick:submit, className:'trs-btn-primary w-full py-3 rounded-lg font-bold text-sm' }, 'Save Adjustment')
    )
  );
}

const REPORT_TABS = ['Sales','Orders','Products','Inventory','Profit','Customers','Payments','Shipping'];
const DATE_FILTERS = ['Today','Yesterday','7 Days','30 Days','This Month','Last Month'];
function ReportsPage(){
  const { data } = useAdmin();
  const showToast = useToast();
  const [tab, setTab] = useState('Sales');
  const [dateFilter, setDateFilter] = useState('30 Days');

  const paidOrders = data.orders.filter(o=>o.paymentStatus==='Paid');
  const grossSales = paidOrders.reduce((s,o)=>s+o.subtotal,0);
  const netSales = paidOrders.reduce((s,o)=>s+o.total,0);
  const aov = paidOrders.length ? Math.round(netSales/paidOrders.length) : 0;
  const totalDiscount = paidOrders.reduce((s,o)=>s+o.discount,0);
  const shippingRevenue = paidOrders.reduce((s,o)=>s+o.shippingCost,0);
  const refundAmount = data.orders.filter(o=>o.paymentStatus==='Refunded').reduce((s,o)=>s+o.total,0);
  const revenue = netSales;
  const cogs = data.products.reduce((s,p)=> s + p.hpp * 7, 0);
  const grossProfit = revenue - cogs;
  const grossMargin = revenue ? Math.round((grossProfit/revenue)*100) : 0;

// ==================== ROUTES / APP ====================
const ADMIN_ROUTES = [
  { pattern:'/admin', component: DashboardPage },
  { pattern:'/admin/products', component: ProductListPage },
  { pattern:'/admin/products/new', component: ProductWizardPage },
  { pattern:'/admin/products/:id', component: ProductDetailAdminPage },
  { pattern:'/admin/orders', component: OrdersListPage },
  { pattern:'/admin/orders/:orderId', component: OrderDetailPage },
  { pattern:'/admin/shipping', component: ShippingPage },
  { pattern:'/admin/inventory', component: InventoryPage },
  { pattern:'/admin/customers', component: CustomersPage },
  { pattern:'/admin/customers/:id', component: CustomerDetailPage },
  { pattern:'/admin/promotions', component: PromotionsPage },
  { pattern:'/admin/returns', component: ReturnsPage },
  { pattern:'/admin/suppliers', component: SuppliersPage },
  { pattern:'/admin/payments', component: PaymentsPage },
  { pattern:'/admin/reports', component: ReportsPage },
  { pattern:'/admin/staff', component: StaffPage },
  { pattern:'/admin/settings', component: SettingsPage },
  { pattern:'/admin/logout', component: LogoutPage },
];
function resolveAdminRoute(path){
  for(const r of ADMIN_ROUTES){ const params = matchRoute(r.pattern, path); if(params) return { component:r.component, params }; }
  return { component: NotFoundAdminPage, params:{} };
}

function App(){
  const [path, setPath] = useState(getHashPath());
  useEffect(()=>{ function onHashChange(){ setPath(getHashPath()); window.scrollTo(0,0); } window.addEventListener('hashchange', onHashChange); return ()=>window.removeEventListener('hashchange', onHashChange); },[]);
  const navigate = useCallback((to)=>{
    if(('#'+to) === window.location.hash){ setPath(to); window.scrollTo(0,0); } else { window.location.hash = to; }
  },[]);
  const router = useMemo(()=>({ path, navigate }), [path, navigate]);
  const { toasts, show } = useToastState();
  const admin = useAdminLogic(show);

  const { component: PageComponent, params } = resolveAdminRoute(path);

  return h(RouterContext.Provider, { value: router },
    h(ToastContext.Provider, { value: show },
      h(AdminContext.Provider, { value: admin },
        h(AdminShell, { path },
          h(PageComponent, { params, key: path })
        ),
        h(ToastHost, { toasts })
      )
    )
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(h(App));
